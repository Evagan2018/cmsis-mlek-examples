name: CLANG Alif build test
on:

  workflow_dispatch:
  #pull_request:
  #  branches: [main]
  #push:
  #  branches: [main]
  #schedule:
  #  - cron: '00 20 * * 6'


jobs:
  CI:
    strategy:
      matrix:
        context: [
          { tool: CLANG,   dir: ./Alif/AppKit_D3/MLEK_Audio,                   proj: mlek_audio,           target_type: AE722F80F55D5LS-U55-128, build_type: Debug-Live_Stream },
          { tool: CLANG,   dir: ./Alif/AppKit_D3/MLEK_Audio,                   proj: mlek_audio,           target_type: AE722F80F55D5LS-U55-128, build_type: Release-Live_Stream },
          { tool: CLANG,   dir: ./Alif/AppKit_D3/MLEK_Video,                   proj: mlek_video,           target_type: AE722F80F55D5LS-U55-256, build_type: Debug-Live_Stream },
          { tool: CLANG,   dir: ./Alif/AppKit_D3/MLEK_Video,                   proj: mlek_video,           target_type: AE722F80F55D5LS-U55-256, build_type: Release-Live_Stream },
          { tool: CLANG,   dir: ./Alif/AppKit_D3/MLEK_AV_DualCore,             proj: mlek_dual,            target_type: AE722F80F55D5LS,         build_type: Debug-Live_Stream },
          { tool: CLANG,   dir: ./Alif/AppKit_D3/MLEK_AV_DualCore,             proj: mlek_dual,            target_type: AE722F80F55D5LS,         build_type: Release-Live_Stream },
          { tool: CLANG,   dir: ./Alif/AppKit_D3/Tensorflow_LiteRT_HelloWorld, proj: TFLiteRT_HelloWorld,  target_type: AE722F80F55D5LS,         build_type: Debug },
          { tool: CLANG,   dir: ./Alif/AppKit_D3/Tensorflow_LiteRT_HelloWorld, proj: TFLiteRT_HelloWorld,  target_type: AE722F80F55D5LS,         build_type: Release }
          ]

      fail-fast: false

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Activate vcpkg
      uses: ARM-software/cmsis-actions/vcpkg@v1
      with: 
        config: "./vcpkg-configuration.json"


    # --------------------------------------------------------------
    # S T A R T  T O O L  I N J E C T I O N 

    # CMSIS_TOOLBOX_TOKEN must have Actions: Read permission for
    # Open-CMSIS-Pack/cmsis-toolbox.
    - name: Download nightly CMSIS-Toolbox
      uses: actions/download-artifact@v8
      with:
        artifact-ids: "10179205258"
        repository: Open-CMSIS-Pack/cmsis-toolbox
        run-id: "34546425921"
        github-token: ${{ secrets.CMSIS_TOOLBOX_TOKEN }}
        path: ${{ runner.temp }}/cmsis-toolbox-nightly

    - name: Override CMSIS-Toolbox with nightly version
      shell: bash
      run: |
        set -euo pipefail

        TOOLBOX_BIN="${RUNNER_TEMP}/cmsis-toolbox-nightly/bin"

        test -x "${TOOLBOX_BIN}/cbuild" ||
          chmod -R +x "${TOOLBOX_BIN}"

        # Entries written to GITHUB_PATH are prepended to PATH for all
        # following steps, overriding the version activated by vcpkg.
        echo "${TOOLBOX_BIN}" >> "${GITHUB_PATH}"

    # DIAGNOSIS
    - name: Verify nightly CMSIS-Toolbox
      shell: bash
      run: |
        set -euo pipefail

        EXPECTED_BIN="${RUNNER_TEMP}/cmsis-toolbox-nightly/bin"
        ACTUAL_CBUILD="$(command -v cbuild)"

        case "${ACTUAL_CBUILD}" in
          "${EXPECTED_BIN}/"*) ;;
          *)
            echo "::error::Unexpected cbuild selected: ${ACTUAL_CBUILD}"
            exit 1
            ;;
        esac

        echo "Using cbuild: ${ACTUAL_CBUILD}"
        cbuild --version

    # E N D  T O O L  I N J E C T I O N 
    # --------------------------------------------------------------


    - name: Activate Arm tool license
      uses: ARM-software/cmsis-actions/armlm@v1

    - name: Cache downloaded packs
      uses: actions/cache@v6
      with:
        key: Alif
        path: /home/runner/.cache/arm/packs/.Download

    - name: ${{matrix.context.tool}} Build-Test for context ${{matrix.context.proj}}.${{matrix.context.build_type}}+${{matrix.context.target_type}}
      working-directory: ${{matrix.context.dir}}
      run: |
        cbuild ${{matrix.context.proj}}.csolution.yml --context .${{matrix.context.build_type}}+${{matrix.context.target_type}} --toolchain ${{matrix.context.tool}} --packs

    - name: Upload output for context ${{matrix.context.proj}}.${{matrix.context.build_type}}+${{matrix.context.target_type}}
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.context.tool}}_build_${{matrix.context.proj}}.${{matrix.context.build_type}}+${{matrix.context.target_type}}
        path: ${{matrix.context.dir}}/out

